<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>فیلم‌یاب | جستجوی هوشمند فیلم</title>
    
    <!-- 🌟 لوگوی اختصاصی (SVG) 🌟 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%230a0a12' stroke='%2306b6d4' stroke-width='4'/%3E%3Ccircle cx='42' cy='42' r='20' fill='none' stroke='%23f5b942' stroke-width='6'/%3E%3Cline x1='56' y1='56' x2='75' y2='75' stroke='%23f5b942' stroke-width='8' stroke-linecap='round'/%3E%3Cpolygon points='38,32 38,52 52,42' fill='%237c3aed'/%3E%3C/svg%3E">
    
    <!-- 📱 تنظیمات PWA برای نصب روی گوشی -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a12">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%230a0a12' stroke='%2306b6d4' stroke-width='4'/%3E%3Ccircle cx='42' cy='42' r='20' fill='none' stroke='%23f5b942' stroke-width='6'/%3E%3Cline x1='56' y1='56' x2='75' y2='75' stroke='%23f5b942' stroke-width='8' stroke-linecap='round'/%3E%3Cpolygon points='38,32 38,52 52,42' fill='%237c3aed'/%3E%3C/svg%3E">

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050508;
            --surface-color: rgba(25, 25, 35, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-glow: #7c3aed;
            --secondary-glow: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 60px; 
        }

        .bg-glow-1, .bg-glow-2 {
            position: fixed; width: 600px; height: 600px; border-radius: 50%;
            filter: blur(120px); z-index: -1; opacity: 0.15; pointer-events: none;
        }
        .bg-glow-1 { top: -200px; right: -200px; background: var(--primary-glow); }
        .bg-glow-2 { bottom: -200px; left: -200px; background: var(--secondary-glow); }

        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; width: 100%; flex: 1; }

        .header { text-align: center; margin-bottom: 40px; display: flex; flex-direction: column; align-items: center; }
        .header h1 {
            font-size: 2.5rem; font-weight: 800; margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { color: var(--text-muted); font-size: 1.1rem; }

        .tabs-container {
            display: flex; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);
            border-radius: 50px; padding: 5px; margin-bottom: 30px; backdrop-filter: blur(10px);
        }
        .tab-btn {
            flex: 1; background: transparent; border: none; color: var(--text-muted);
            padding: 10px 5px; border-radius: 40px; cursor: pointer; font-size: 0.9rem; font-weight: 700;
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .tab-btn svg { width: 16px; height: 16px; }
        .tab-btn.active { background: rgba(255, 255, 255, 0.1); color: #fff; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); }
        .tab-btn:hover:not(.active) { color: #fff; }

        .panel { display: none; animation: fadeIn 0.4s ease-out; }
        .panel.active { display: block; }

        .glass-box {
            background: rgba(25, 25, 35, 0.6); border: 1px solid var(--border-color);
            border-radius: 24px; padding: 30px; backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        textarea, input[type="text"] {
            width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color);
            color: #fff; padding: 16px; border-radius: 12px; font-size: 1rem; transition: all 0.3s; outline: none; resize: vertical;
        }
        textarea:focus, input[type="text"]:focus { border-color: var(--primary-glow); box-shadow: 0 0 15px rgba(124, 58, 237, 0.2); }

        .btn-primary {
            width: 100%; padding: 16px; border: none; border-radius: 12px; margin-top: 15px;
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            color: #fff; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5); }

        .dropzone {
            border: 2px dashed var(--border-color); border-radius: 16px; padding: 30px 20px;
            text-align: center; cursor: pointer; transition: all 0.3s; background: rgba(0, 0, 0, 0.2); margin-bottom: 20px;
        }
        .dropzone:hover { border-color: var(--secondary-glow); background: rgba(6, 182, 212, 0.05); }
        .dropzone-icon { font-size: 3rem; margin-bottom: 10px; }

        .divider { display: flex; align-items: center; text-align: center; color: var(--text-muted); margin: 20px 0; font-size: 0.9rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider:not(:empty)::before { margin-left: .5em; }
        .divider:not(:empty)::after { margin-right: .5em; }

        .instagram-input-box { display: flex; gap: 10px; }
        .instagram-input-box input { flex: 1; direction: ltr; }

        /* ================= 🌟 استایل منوی ژانر و لیست پیشنهاد امروز 🌟 ================= */
        .genre-selector {
            width: 100%; padding: 12px 16px; margin-bottom: 20px;
            background: rgba(0,0,0,0.4); border: 1px solid var(--border-color);
            color: #fff; border-radius: 12px; font-family: inherit; font-size: 1rem;
            outline: none; cursor: pointer; appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: left 15px top 50%; background-size: 12px auto;
        }
        .genre-selector:focus { border-color: var(--secondary-glow); }

        .trending-list {
            display: flex; flex-direction: column; gap: 12px; max-height: 60vh; overflow-y: auto; padding-left: 5px;
        }
        .trending-list::-webkit-scrollbar { width: 6px; }
        .trending-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        .trending-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .trending-list::-webkit-scrollbar-thumb:hover { background: var(--secondary-glow); }

        .trending-item {
            display: flex; gap: 15px; align-items: center; background: rgba(255,255,255,0.03);
            padding: 12px; border-radius: 16px; text-decoration: none; color: #fff;
            border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .trending-item:hover { background: rgba(255,255,255,0.08); border-color: var(--secondary-glow); transform: translateX(-5px); }
        .trending-poster { width: 60px; height: 90px; border-radius: 8px; object-fit: cover; background: #1e1e2f; }
        .trending-info { flex: 1; display: flex; flex-direction: column; }
        .trending-title { font-weight: 800; font-size: 1rem; margin-bottom: 5px; }
        .trending-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 10px; }

        #loader { display: none; text-align: center; margin-top: 40px; color: var(--secondary-glow); }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(6, 182, 212, 0.2);
            border-top-color: var(--secondary-glow); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        .progress-container {
            width: 80%; max-width: 300px; height: 8px; background: rgba(255, 255, 255, 0.1);
            border-radius: 10px; margin: 15px auto 5px; overflow: hidden;
        }
        .progress-bar {
            height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary-glow), var(--secondary-glow));
            border-radius: 10px; transition: width 0.3s ease;
        }
        #progress-text { font-size: 0.85rem; color: var(--text-muted); font-family: monospace; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: var(--surface-color); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px; width: 90%; max-width: 750px; max-height: 90vh; overflow-y: auto;
            position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            transform: scale(0.8) translateY(20px); opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }
        .close-modal {
            position: absolute; top: 15px; left: 15px; background: rgba(255,255,255,0.1);
            border: none; color: white; width: 36px; height: 36px; border-radius: 50%;
            cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; z-index: 10;
        }
        .close-modal:hover { background: #ef4444; transform: rotate(90deg); }
        
        .result-card { padding: 30px; display: flex; gap: 24px; }
        .poster {
            width: 180px; height: 270px; border-radius: 16px; object-fit: cover;
            background: linear-gradient(135deg, #1e1e2f, #0a0a12); border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            font-size: 3rem; font-weight: bold; color: #444;
        }
        .info { flex: 1; display: flex; flex-direction: column; }
        .title-fa { font-size: 1.8rem; font-weight: 800; margin-bottom: 5px; }
        .title-en { font-size: 1rem; color: var(--text-muted); margin-bottom: 15px; direction: ltr; text-align: right; }
        
        .badges { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .badge {
            background: rgba(255,255,255,0.05); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 6px;
        }
        .badge.confidence { color: #34d399; background: rgba(52, 211, 153, 0.1); border-color: rgba(52, 211, 153, 0.2); }
        
        .desc {
            background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; line-height: 1.8;
            font-size: 0.95rem; color: #cbd5e1; border-right: 4px solid var(--secondary-glow); margin-bottom: 20px;
        }
        .desc[dir="ltr"] { border-right: none; border-left: 4px solid var(--secondary-glow); text-align: left;}
        
        .actions { display: flex; gap: 10px; margin-top: auto; }
        .btn-action {
            padding: 10px 20px; border-radius: 10px; text-decoration: none; font-weight: 700;
            font-size: 0.9rem; transition: all 0.3s; text-align: center; flex: 1;
        }
        .btn-imdb { background: #f5c518; color: #000; }
        .btn-imdb:hover { background: #e0b20f; transform: translateY(-2px); }
        .btn-google { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-google:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }

        .alternatives { margin-top: 20px; border-top: 1px dashed var(--border-color); padding-top: 15px; font-size: 0.9rem; }
        .footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.9rem; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 600px) {
            .tab-btn { font-size: 0.8rem; flex-direction: column; gap: 4px; padding: 10px 2px; }
            .result-card { flex-direction: column; align-items: center; padding: 20px; }
            .poster { width: 140px; height: 210px; }
            .info { text-align: center; width: 100%; }
            .title-en { text-align: center; }
            .badges, .actions { justify-content: center; }
            .desc { border-right: none; border-bottom: 3px solid var(--secondary-glow); }
            .modal-content { width: 95%; }
        }
    </style>
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <header class="header">
            <h1>فیلم‌یاب</h1>
            <p>داستانش رو بگو، فیلمش رو پیدا کن!</p>
        </header>

        <div class="tabs-container">
            <button class="tab-btn active" data-tab="text" id="tab-btn-text">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                جستجو با داستان
            </button>
            <button class="tab-btn" data-tab="video" id="tab-btn-video">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                جستجو با ویدیو
            </button>
            <button class="tab-btn" data-tab="trending" id="tab-btn-trending">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                پیشنهاد امروز
            </button>
        </div>

        <div class="panel active" id="panel-text">
            <div class="glass-box">
                <textarea id="story" rows="5" placeholder="مثلاً: تعدادی آدم بازی‌های بچه‌گانه می‌کنند تا جایزه نقدی ببرند، اما اگر اشتباه کنند کشته می‌شوند..."></textarea>
                <button class="btn-primary" id="btn-text">پیدا کن!</button>
            </div>
        </div>

        <div class="panel" id="panel-video">
            <div class="glass-box">
                <div class="dropzone" id="dropzone">
                    <div class="dropzone-icon">🎬</div>
                    <p>ویدیو رو اینجا رها کن یا کلیک کن</p>
                    <small style="color: var(--text-muted)">MP4, MOV, WEBM</small>
                </div>
                <input type="file" id="file-input" accept="video/*" style="display: none;">
                
                <div id="video-info" style="display: none; margin-bottom: 20px; text-align: center;">
                    <p class="filename" style="color: var(--secondary-glow); font-weight: bold; margin-bottom: 5px;"></p>
                    <p class="filesize" style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;"></p>
                    <video id="video-preview" controls style="max-width: 100%; border-radius: 12px; max-height: 200px;"></video>
                </div>

                <div class="divider">یا</div>
                <div class="instagram-input-box">
                    <input type="text" id="insta-link" placeholder="لینک ریلز اینستاگرام...">
                </div>

                <textarea id="caption" rows="2" placeholder="توضیحات ویدیو (اختیاری)..." style="margin-top: 15px;"></textarea>
                <button class="btn-primary" id="btn-video">تحلیل ویدیو / لینک!</button>
            </div>
        </div>

        <div class="panel" id="panel-trending">
            <div class="glass-box">
                <h3 style="text-align: center; margin-bottom: 20px; color: var(--secondary-glow);">🔥 محبوب‌ترین‌های امروز</h3>
                
                <!-- 🌟 منوی انتخاب ژانر 🌟 -->
                <select id="genre-select" class="genre-selector">
                    <option value="all">🌟 همه ژانرها (محبوب‌ترین‌ها)</option>
                    <option value="28">💥 اکشن (Action)</option>
                    <option value="35">😂 کمدی (Comedy)</option>
                    <option value="27">👻 ترسناک (Horror)</option>
                    <option value="878">🚀 علمی تخیلی (Sci-Fi)</option>
                    <option value="18">🎭 درام (Drama)</option>
                    <option value="10749">❤️ عاشقانه (Romance)</option>
                    <option value="16">🎨 انیمیشن (Animation)</option>
                </select>

                <div class="trending-list" id="trending-list">
                    <!-- لیست توسط جاوااسکریپت پر می‌شود -->
                </div>
            </div>
        </div>

        <div id="loader">
            <div class="spinner"></div>
            <p id="loader-text">در حال جستجو در آرشیو سینما...</p>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <span id="progress-text">0%</span>
        </div>
    </div>

    <footer class="footer">
        <p>ساخته‌شده با ❤️</p>
    </footer>

    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">×</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
